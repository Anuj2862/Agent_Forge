version: "3.9"

services:
  # PostgreSQL — evolution memory persistence
  postgres:
    image: postgres:16-alpine
    container_name: agentforge_postgres
    environment:
      POSTGRES_USER: agentforge
      POSTGRES_PASSWORD: agentforge_secret
      POSTGRES_DB: agentforge_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentforge -d agentforge_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis — session/task caching (for future use)
  redis:
    image: redis:7-alpine
    container_name: agentforge_redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  # FastAPI Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: agentforge_backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://agentforge:agentforge_secret@postgres:5432/agentforge_db
      REDIS_URL: redis://redis:6379
      APP_ENV: development
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Next.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    container_name: agentforge_frontend
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  pgdata:
  redisdata:
