name: Agent Forge CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Backend Quality Gate & Tests
    runs-on: ubuntu-latest
    env:
      AGENT_FORGE_MODE: simulation
      AGENT_FORGE_DATABASE_URL: sqlite+aiosqlite:///./ci_test.db
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate imports and application startup
        run: |
          python -c "import app.main; print('FastAPI app import successful')"

      - name: Run Pytest test suite
        run: |
          pytest -v --tb=short

  frontend-build:
    name: Frontend Quality Gate & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install frontend dependencies
        run: npm ci || npm install

      - name: Run ESLint
        run: npm run lint

      - name: Run Next.js production build
        run: npm run build
